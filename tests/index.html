<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio assistant — Nirmalya Sarkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --bg-panel:#10161D; --bg-panel-2:#141C24;
    --line:#1E2A33; --line-soft:#161F27;
    --text:#E7EEEC; --text-dim:#8FA3A6; --text-faint:#516069;
    --accent:#5EEAD4; --accent-soft:rgba(94,234,212,0.12); --accent-2:#F5A623;
    --display:'Space Grotesk',sans-serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#04140F;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  #app{display:flex;flex-direction:column;height:100dvh;position:relative;}
  #app::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:64px 64px;opacity:.35;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 40%,transparent 85%);
  }

  header{
    position:relative;z-index:2;display:flex;align-items:center;gap:16px;
    padding:0 28px;height:64px;flex:none;
    background:rgba(11,15,20,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;}
  .brand svg{width:20px;height:20px;}
  .brand small{color:var(--text-faint);font-size:12px;}
  .links{display:flex;gap:22px;font-size:14px;color:var(--text-dim);margin-left:12px;}
  .links a:hover{color:var(--accent);}
  .actions{margin-left:auto;display:flex;gap:8px;}
  .btn{
    font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;
    border:1px solid var(--line);background:transparent;color:var(--text-dim);
    transition:border-color .2s,color .2s,background .2s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  @media (max-width:640px){ .links,.brand small{display:none;} header{padding:0 16px;} }

  #doc-bar{display:none;flex-wrap:wrap;gap:8px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--bg-panel);position:relative;z-index:2;flex:none;}
  #doc-bar.visible{display:flex;}
  .doc-chip{font-family:var(--mono);font-size:12px;color:var(--text-dim);border:1px dashed var(--line);border-radius:5px;padding:4px 10px;}

  #scroll{flex:1;overflow-y:auto;position:relative;z-index:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
  .col{max-width:760px;margin:0 auto;padding:0 28px;}

  #greeting{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px;}
  #greeting h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.01em;margin-bottom:14px;}
  #greeting p{color:var(--text-dim);font-size:16px;max-width:520px;margin-bottom:28px;}
  .suggest{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
  .suggest button{
    font-family:var(--mono);font-size:13px;color:var(--text-dim);text-align:left;
    background:transparent;border:1px solid var(--line);border-radius:5px;padding:9px 14px;
    transition:border-color .2s,color .2s;
  }
  .suggest button:hover{border-color:var(--accent);color:var(--accent);}

  #messages{padding-top:28px;padding-bottom:12px;display:none;flex-direction:column;gap:22px;}
  .msg{max-width:90%;font-size:15px;word-wrap:break-word;}
  .msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(94,234,212,.28);padding:10px 15px;border-radius:12px 12px 2px 12px;white-space:pre-wrap;}
  .msg.bot{align-self:flex-start;padding-left:14px;border-left:2px solid var(--line);}
  .msg.bot.streaming::after{content:"";display:inline-block;width:7px;height:15px;margin-left:3px;background:var(--accent);vertical-align:-2px;animation:blink 1s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}
  .msg.bot.error{border-left-color:var(--accent-2);color:var(--accent-2);}
  .msg.bot.pending{color:var(--text-faint);font-family:var(--mono);font-size:13px;}
  .msg.bot strong{font-weight:600;}
  .msg.bot code{font-family:var(--mono);font-size:13px;background:var(--bg-panel-2);padding:1px 6px;border-radius:3px;}
  .msg.bot a{color:var(--accent);border-bottom:1px solid rgba(94,234,212,.35);}
  .msg.bot p{margin:0 0 10px;} .msg.bot p:last-child{margin-bottom:0;}
  .msg.bot ul{margin:0 0 10px 20px;} .msg.bot li{margin:3px 0;}
  .cite{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}

  #input-bar{flex:none;position:relative;z-index:2;padding:14px 0 22px;background:linear-gradient(180deg,transparent,var(--bg) 40%);}
  form{display:flex;align-items:flex-end;gap:8px;background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;padding:8px;transition:border-color .2s;}
  form:focus-within{border-color:var(--accent);}
  textarea{flex:1;resize:none;max-height:140px;min-height:40px;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;padding:9px 8px;}
  textarea::placeholder{color:var(--text-faint);}
  .icon{width:40px;height:40px;flex:none;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;}
  .icon:hover{border-color:var(--accent);color:var(--accent);}
  .icon svg{width:17px;height:17px;}
  .send{width:40px;height:40px;flex:none;border:none;border-radius:6px;background:var(--accent);color:#04140F;display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s;}
  .send:hover:not(:disabled){transform:translateY(-1px);}
  .send:disabled{opacity:.4;}
  .send svg{width:17px;height:17px;}
  #status{min-height:18px;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="4" cy="10" r="2.4" stroke="#5EEAD4" stroke-width="1.2"/>
        <circle cx="16" cy="4" r="2.4" stroke="#5EEAD4" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="2.4" stroke="#5EEAD4" stroke-width="1.2"/>
        <line x1="6.1" y1="9" x2="13.9" y2="5" stroke="#5EEAD4" stroke-width="1"/>
        <line x1="6.1" y1="11" x2="13.9" y2="15" stroke="#5EEAD4" stroke-width="1"/>
      </svg>
      Nirmalya Sarkar <small>/ assistant</small>
    </div>
    <nav class="links">
      {% if portfolio_url %}<a href="{{ portfolio_url }}">Portfolio</a>{% endif %}
      <a href="https://github.com/Nirmalya625/nirmalya-sarkar" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/nirmalyasarkar/" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
    <div class="actions">
      <button class="btn" id="new-chat" type="button">New chat</button>
    </div>
  </header>

  <div id="doc-bar"></div>

  <div id="scroll">
    <div class="col" id="greeting">
      <h1>Ask about Nirmalya's projects</h1>
      <p>Answers come from his project write-ups. Attach a job description as a PDF and I'll match his work to its requirements.</p>
      <div class="suggest" id="suggest">
        <button type="button">What has he built?</button>
        <button type="button">How does the fraud detector explain its predictions?</button>
        <button type="button">Which projects use retrieval-augmented generation?</button>
        <button type="button">What is his tech stack?</button>
      </div>
    </div>
    <div class="col" id="messages" aria-live="polite"></div>
  </div>

  <div id="input-bar">
    <div class="col">
      <form id="form">
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
        <button class="icon" id="attach" type="button" aria-label="Attach a PDF" title="Attach a PDF, e.g. a job description">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
        </button>
        <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about a project…" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div id="status"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var sid;
  try { sid = localStorage.getItem('chat_sid'); } catch(e){}
  if(!sid){
    sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    try { localStorage.setItem('chat_sid', sid); } catch(e){}
  }
  var H = function(extra){ var h = {'X-Session-Id': sid}; for(var k in (extra||{})) h[k] = extra[k]; return h; };

  var $ = function(id){ return document.getElementById(id); };
  var scrollEl = $('scroll'), greeting = $('greeting'), messages = $('messages'), suggest = $('suggest');
  var form = $('form'), input = $('input'), sendBtn = $('send'), status = $('status');
  var docBar = $('doc-bar'), fileInput = $('file-input');
  var busy = false;

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    s = esc(s);
    s = s.replace(/\[Source: ([^\]]+)\]/g, '<span class="cite">[Source: $1]</span>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function render(text){
    var out = [], list = [];
    function flush(){ if(list.length){ out.push('<ul>' + list.join('') + '</ul>'); list = []; } }
    text.split('\n').forEach(function(line){
      var m = line.match(/^\s*[-*•]\s+(.*)/);
      if(m){ list.push('<li>' + inline(m[1]) + '</li>'); return; }
      flush();
      if(line.trim()) out.push('<p>' + inline(line) + '</p>');
    });
    flush();
    return out.join('');
  }
  function toBottom(){ scrollEl.scrollTop = scrollEl.scrollHeight; }

  function showChat(){ greeting.style.display = 'none'; messages.style.display = 'flex'; }
  function showGreeting(){ greeting.style.display = 'flex'; messages.style.display = 'none'; messages.innerHTML = ''; }

  function addMsg(kind, text){
    var el = document.createElement('div');
    el.className = 'msg ' + kind;
    if(kind === 'user') el.textContent = text; else el.innerHTML = render(text);
    messages.appendChild(el);
    toBottom();
    return el;
  }

  function renderDocs(names){
    docBar.innerHTML = '';
    docBar.classList.toggle('visible', names.length > 0);
    names.forEach(function(n){
      var c = document.createElement('div');
      c.className = 'doc-chip';
      c.textContent = n;               // textContent: filenames are never parsed as HTML
      docBar.appendChild(c);
    });
  }

  async function send(text){
    text = text.trim();
    if(!text || busy) return;
    busy = true; sendBtn.disabled = true;
    showChat();
    addMsg('user', text);
    var bot = addMsg('bot pending', 'thinking…');
    var acc = '';
    try{
      var res = await fetch('/api/chat/stream', {method:'POST', headers:H({'Content-Type':'application/json'}), body:JSON.stringify({message:text})});
      if(!res.ok){
        var err = {}; try { err = await res.json(); } catch(e){}
        throw new Error(err.error || ('Request failed (' + res.status + ')'));
      }
      var reader = res.body.getReader(), dec = new TextDecoder();
      bot.className = 'msg bot streaming'; bot.innerHTML = '';
      while(true){
        var r = await reader.read();
        if(r.done) break;
        acc += dec.decode(r.value, {stream:true});
        bot.innerHTML = render(acc);
        toBottom();
      }
      bot.className = 'msg bot';
      if(!acc) bot.innerHTML = render('No response. Please try again.');
    }catch(e){
      bot.className = 'msg bot error';
      bot.textContent = (e && e.message && e.message !== 'Failed to fetch') ? e.message : 'Could not reach the server. Try again in a moment.';
    }
    busy = false; sendBtn.disabled = false; input.focus();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var t = input.value; input.value = ''; input.style.height = 'auto';
    send(t);
  });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  suggest.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ send(b.textContent); });
  });

  $('attach').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', async function(){
    var f = fileInput.files[0]; fileInput.value = '';
    if(!f) return;
    status.textContent = 'Indexing ' + f.name + '…';
    var fd = new FormData(); fd.append('file', f);
    try{
      var res = await fetch('/api/upload', {method:'POST', headers:H(), body:fd});
      var data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Upload failed');
      renderDocs(data.documents || []);
      status.textContent = f.name + ' indexed (' + data.chunks_added + ' chunks). Ask how Nirmalya\'s work matches it.';
    }catch(e){
      status.textContent = (e && e.message && e.message !== 'Failed to fetch') ? e.message : 'Upload failed: could not reach the server.';
    }
  });

  $('new-chat').addEventListener('click', async function(){
    try { await fetch('/api/reset', {method:'POST', headers:H()}); } catch(e){}
    renderDocs([]); status.textContent = ''; showGreeting();
  });

  /* restore attached-PDF chips after a page refresh */
  fetch('/api/documents', {headers:H()}).then(function(r){ return r.json(); }).then(function(d){ renderDocs(d.documents || []); }).catch(function(){});
})();
</script>
</body>
</html>
